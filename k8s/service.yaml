apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-clusterip
spec:
  type: ClusterIP
  selector:
    app: btc-forecast-api
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-nodeport
spec:
  type: NodePort
  selector:
    app: btc-forecast-api
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
